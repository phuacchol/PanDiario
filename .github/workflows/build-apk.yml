name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        working-directory: ./frontend
        run: yarn install

      - name: Generar proyecto Android nativo (Expo Prebuild)
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean

      - name: Asignar firma automatica a Release
        working-directory: ./frontend/android/app
        run: |
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' build.gradle || true

      - name: Dar permisos de ejecucion a gradlew
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Compilar APK Release Independiente (arm64-v8a)
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Guardar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PanDiario-Release-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
